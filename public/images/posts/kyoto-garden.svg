<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="kyoto-garden-title">
  <title id="kyoto-garden-title">Stone lantern and raked gravel in a temple courtyard</title>
  <rect width="800" height="450" fill="#1b1c1e" />
  <!-- Raked sand lines -->
  <path d="M0 320 Q 400 300, 800 320" stroke="#37393d" stroke-width="2" fill="none" />
  <path d="M0 345 Q 400 325, 800 345" stroke="#37393d" stroke-width="2" fill="none" />
  <path d="M0 370 Q 400 350, 800 370" stroke="#37393d" stroke-width="2" fill="none" />
  <path d="M0 395 Q 400 375, 800 395" stroke="#37393d" stroke-width="2" fill="none" />
  <path d="M0 420 Q 400 400, 800 420" stroke="#37393d" stroke-width="2" fill="none" />
  <!-- Stone lantern -->
  <rect x="490" y="270" width="20" height="70" rx="3" fill="#686b73" />
  <rect x="475" y="250" width="50" height="20" rx="2" fill="#52555c" />
  <polygon points="460,250 500,210 540,250" fill="#7a7e87" />
  <circle cx="500" cy="205" r="7" fill="#8a8e97" />
  <!-- Moss and maple branch -->
  <path d="M60 410 Q 140 370, 220 410 Z" fill="#2d3b2f" />
  <path d="M0 60 Q 200 80, 320 180" stroke="#4a3728" stroke-width="4" fill="none" />
  <circle cx="280" cy="150" r="10" fill="#d97757" />
  <circle cx="310" cy="175" r="8" fill="#c05638" />
  <circle cx="250" cy="130" r="9" fill="#e28c70" />
</svg>
